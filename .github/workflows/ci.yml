# CI：转移图静态校验 + 单源构建对账 + 全量测试（设计文档目标 1「静态校验进 CI」的载体）
# 本地等价命令序列见各 step；无 npm 依赖，Node 直跑
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 内核转移表静态校验（无环除回边/可达/执行器唯一/谓词与角色在词表/写入矩阵词表闭包）
        run: node skills/self/dev-workflow/delivery-v5/scripts/delivery-core.mjs validate
      - name: 内核转移表静态校验（V6 现行代，同上一条的五类检查；V5 为冻结参照退役前保留）
        run: node skills/self/dev-workflow/delivery-v6/scripts/delivery-core.mjs validate
      - name: workflow 单源构建 --check（改源忘构建拦截）
        run: node scripts/build-workflows.mjs --check
      - name: zcode/pi 双平台产物对账
        run: node scripts/check-workflow-parity.mjs
      - name: workflow 产物 tsc strict
        run: node scripts/check-workflow-types.mjs
      - name: 版本纪律（SKILL.md 版本与产物一致）
        run: node scripts/check-version-discipline.mjs
      - name: 安装测试依赖（typescript——测试转译执行器 scripts/tests/helpers/mjs-runner.mjs 引用）
        run: npm install --no-save
      - name: 全量测试（默认层 V6+基建，代际层 V4/V5——冻结通道的环境漂移预警在此兜底）
        run: node --test scripts/tests/*.test.mjs
